<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta name="theme-color" content="#26305e" />
    <title>쉼터</title>
  </head>
  <body>
    <main id="app">
      <div id="stage"></div>
      <div id="status" class="pill" data-kind="wait">함께 쉴 자리를 찾는 중…</div>
      <p id="hint">바닥을 톡 눌러 걸어보세요</p>
      <nav id="actionbar" aria-label="행동"></nav>
      <button id="switch" type="button" aria-label="공간 바꾸기" hidden>⇄</button>
      <section id="picker" hidden>
        <h1>오늘은 어디서 쉴까요?</h1>
        <p>같은 곳을 고른 동료들과 함께 있게 돼요</p>
        <div class="cards"></div>
      </section>
      <div id="rotate"><span>📱</span><p>화면을 세로로 돌려주세요</p></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
