<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta name="theme-color" content="#26305e" />
    <link rel="icon" href="data:," />
    <title>쉼터</title>
  </head>
  <body>
    <main id="app">
      <div id="stage"></div>
      <div id="status" class="pill" data-kind="wait">함께 쉴 자리를 찾는 중…</div>
      <p id="hint"></p>
      <p id="toast" role="status"></p>
      <nav id="actionbar" aria-label="행동"></nav>
      <button id="switch" type="button" aria-label="공간 바꾸기" hidden>⇄</button>
      <button id="sound" type="button" aria-label="소리" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z" fill="currentColor" />
          <g class="waves" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M15.5 9.2a4 4 0 0 1 0 5.6" />
            <path d="M18 6.8a7.4 7.4 0 0 1 0 10.4" />
          </g>
          <g class="mute" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M15.5 9.5l5 5M20.5 9.5l-5 5" />
          </g>
        </svg>
      </button>
      <button id="lantern" type="button" class="fab" aria-label="풍등 날리기" hidden>
        <span class="emoji">🏮</span><span class="label">풍등</span><span class="cd"><b></b></span>
      </button>
      <button id="roast" type="button" class="fab" aria-label="마시멜로 굽기" hidden>
        <span class="emoji">🍢</span><span class="label">마시멜로</span><span class="cd"><b></b></span>
      </button>
      <div id="lantern-sheet" class="sheet" hidden></div>
      <div id="lantern-hide" class="sheet" hidden></div>
      <section id="picker" hidden>
        <h1>오늘은 어디서 쉴까요?</h1>
        <p>같은 곳을 고른 동료들과 함께 있게 돼요</p>
        <div class="cards"></div>
      </section>
      <section id="star-game" hidden aria-label="별 받기 게임">
        <div class="game-stars" aria-hidden="true"></div>
        <header class="game-hud">
          <div><small>현재 점수</small><strong id="game-score">0</strong></div>
          <div class="game-time"><small>남은 시간</small><strong><span id="game-time">30</span><small>초</small></strong></div>
          <div><small>최고 점수</small><strong id="game-best">0</strong></div>
        </header>
        <p id="game-connection">함께할 친구를 찾는 중…</p>
        <div id="game-field" aria-label="별이 떨어지는 게임 화면"></div>
        <aside class="game-board" aria-label="실시간 순위">
          <div class="game-board-title"><strong>실시간 순위</strong><span>현재 라운드</span></div>
          <ol id="game-rank"></ol>
        </aside>
        <div id="game-overlay" class="game-overlay">
          <div class="game-card">
            <span class="game-logo" aria-hidden="true">🌟</span>
            <h2 id="game-title">별 받기</h2>
            <p id="game-message">30초 동안 떨어지는 별을 눌러보세요.<br />별 +10점 · 폭탄 −20점</p>
            <button id="game-start" type="button">게임 시작</button>
            <small>같은 방 친구와 실시간으로 점수를 나눠요</small>
          </div>
        </div>
      </section>
      <div id="rotate"><span>📱</span><p>화면을 세로로 돌려주세요</p></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
